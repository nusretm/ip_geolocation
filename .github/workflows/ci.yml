name: Rust CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --locked --workspace
      - name: Fetch synthetic MMDB fixture for updater tests
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "GeoIP2-City-Test.mmdb"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data/GeoIP2-City-Test.mmdb" -OutFile $fixture
          "MAXMIND_TEST_MMDB_PATH=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $alternate = Join-Path $env:RUNNER_TEMP "GeoLite2-City-Test.mmdb"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data/GeoLite2-City-Test.mmdb" -OutFile $alternate
          "MAXMIND_TEST_MMDB_ALTERNATE_PATH=$alternate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test
        run: cargo test --locked --workspace
      - name: Smoke trusted-IP or API-key HTTP and MMDB lookups
        shell: pwsh
        run: |
          cargo build --locked --workspace
          $exe = if ($IsWindows) { "./target/debug/remvibe-geolocation.exe" } else { "./target/debug/remvibe-geolocation" }
          $work = Join-Path $env:RUNNER_TEMP "remvibe-geo-smoke"
          $db = Join-Path $work "databases"
          New-Item -ItemType Directory -Force -Path $db | Out-Null
          $root = "https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data"
          Invoke-WebRequest -Uri "$root/GeoIP2-City-Test.mmdb" -OutFile (Join-Path $db "City.mmdb")
          Invoke-WebRequest -Uri "$root/GeoIP2-Country-Test.mmdb" -OutFile (Join-Path $db "Country.mmdb")
          Invoke-WebRequest -Uri "$root/GeoLite2-ASN-Test.mmdb" -OutFile (Join-Path $db "ASN.mmdb")
          $config = Join-Path $work "config.toml"
          @'
          [server]
          host = "127.0.0.1"
          port = 19000
          [security]
          trusted_ips = ["127.0.0.1/32", "::1/128"]
          api_keys_file = "api_keys.json"
          [providers.maxmind]
          city = "databases/City.mmdb"
          country = "databases/Country.mmdb"
          asn = "databases/ASN.mmdb"
          '@ | Set-Content -Path $config

          $keyOutput = & $exe --config $config --api-key --api-key-name "MTN Launcher"
          $keyMatch = [regex]::Match(($keyOutput -join "`n"), "API Key: (rvg_[a-f0-9]{64})")
          if (-not $keyMatch.Success) { throw "API key could not be created" }
          $key = $keyMatch.Groups[1].Value
          $keyList = (& $exe --config $config --api-key-list) -join "`n"
          if ($keyList -notmatch "MTN Launcher" -or $keyList -match [regex]::Escape($key)) { throw "Key list content invalid" }

          $server = Start-Process -FilePath $exe -ArgumentList @("--config", $config) -PassThru -NoNewWindow
          try {
            $response = $null
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:19000/" -Headers @{ "X-API-Key" = $key } -SkipHttpErrorCheck
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $response -or $response.StatusCode -ne 200) { throw "Server did not answer with 200" }
            $missing = Invoke-WebRequest -Uri "http://127.0.0.1:19000/" -SkipHttpErrorCheck
            if ($missing.StatusCode -ne 200) { throw "Trusted TCP peer was wrongly rejected without API key" }
            $invalidHeader = Invoke-WebRequest -Uri "http://127.0.0.1:19000/" -Headers @{ "X-API-Key" = "invalid-key" } -SkipHttpErrorCheck
            if ($invalidHeader.StatusCode -ne 200) { throw "Trusted TCP peer was wrongly rejected with invalid API key" }

            $city = Invoke-RestMethod -Uri "http://127.0.0.1:19000/v1/geoip?ip=81.2.69.160" -Headers @{ "X-API-Key" = $key }
            if ($city.country -ne "United Kingdom" -or $city.sources.location -ne "maxmind") {
              throw "City MMDB lookup failed"
            }
            $asn = Invoke-RestMethod -Uri "http://127.0.0.1:19000/v1/geoip?ip=1.128.0.0" -Headers @{ "X-API-Key" = $key }
            if ($asn.asn.number -ne 1221 -or $asn.sources.asn -ne "maxmind") {
              throw "ASN MMDB lookup failed"
            }
            $bad = Invoke-WebRequest -Uri "http://127.0.0.1:19000/v1/geoip?ip=not_an_ip" -Headers @{ "X-API-Key" = $key } -SkipHttpErrorCheck
            if ($bad.StatusCode -ne 400) { throw "Invalid IP was accepted" }

            & $exe --config $config --delete-api-key $key
            $revoked = Invoke-WebRequest -Uri "http://127.0.0.1:19000/" -Headers @{ "X-API-Key" = $key } -SkipHttpErrorCheck
            if ($revoked.StatusCode -ne 200) { throw "Trusted TCP peer was wrongly denied after its key was revoked" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Real DB-IP Lite country and ASN HTTPS / MMDB smoke
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { "./target/debug/remvibe-geolocation.exe" } else { "./target/debug/remvibe-geolocation" }
          $work = Join-Path $env:RUNNER_TEMP "dbip-lite-real-smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $config = Join-Path $work "config.toml"
          @'
          [server]
          host = "127.0.0.1"
          port = 19001
          [security]
          trusted_ips = ["127.0.0.1/32", "::1/128"]
          api_keys_file = "api_keys.json"
          [providers.dbip]
          country = "country.mmdb"
          asn = "asn.mmdb"
          [providers.dbip.updates]
          enabled = false
          check_on_start = false
          state_file = "dbip-updates.json"
          '@ | Set-Content -Path $config

          # The CLI downloads actual monthly DB-IP MMDB.gz files, verifies
          # metadata, extracts and atomically installs them. No fake fixture.
          $output = (& $exe --config $config --check-dbip-updates) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $output -notmatch "DB-IP country: updated" -or $output -notmatch "DB-IP asn: updated") {
            throw "DB-IP live download failed: $output"
          }

          $keyOutput = (& $exe --config $config --api-key --api-key-name "DB-IP CI") -join "`n"
          $match = [regex]::Match($keyOutput, "API Key: (rvg_[a-f0-9]{64})")
          if (-not $match.Success) { throw "Failed to create DB-IP smoke key" }
          $key = $match.Groups[1].Value
          $server = Start-Process -FilePath $exe -ArgumentList @("--config", $config) -PassThru -NoNewWindow
          try {
            $result = $null
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $result = Invoke-RestMethod -Uri "http://127.0.0.1:19001/v1/geoip?ip=8.8.8.8" -Headers @{ "X-API-Key" = $key }
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $result -or $result.country_code -ne "US" -or $result.sources.location -ne "dbip") {
              throw "Real DB-IP country lookup failed"
            }
            if ($null -eq $result.asn -or $result.asn.number -ne 15169 -or $result.sources.asn -ne "dbip") {
              throw "Real DB-IP ASN lookup failed: $($result | ConvertTo-Json -Depth 8 -Compress)"
            }
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:19001/v1/geoip?ip=8.8.8.8" -Headers @{ "X-API-Key" = $key }
            if ($response.Headers["X-Data-Attribution"] -notmatch "db-ip.com") { throw "Missing DB-IP attribution" }
            $info = Invoke-RestMethod -Uri "http://127.0.0.1:19001/v1/attribution" -Headers @{ "X-API-Key" = $key }
            if ($info.dbip.url -ne "https://db-ip.com") { throw "Attribution endpoint failed" }
            $unauthorized = Invoke-WebRequest -Uri "http://127.0.0.1:19001/v1/attribution" -SkipHttpErrorCheck
            if ($unauthorized.StatusCode -ne 200) { throw "Attribution endpoint rejected trusted TCP peer without a key" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Windows SCM install/start/recover/stop/uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "./target/debug/remvibe-geolocation.exe").Path
          $work = Join-Path $env:RUNNER_TEMP "remvibe-r4-scm"
          $data = Join-Path $work "data"
          $databases = Join-Path $data "databases"
          New-Item -ItemType Directory -Force $databases | Out-Null
          Copy-Item $env:MAXMIND_TEST_MMDB_PATH (Join-Path $databases "City.mmdb")
          $config = Join-Path $work "config.toml"
          @'
          [server]
          host = "127.0.0.1"
          port = 19002
          [security]
          trusted_ips = ["127.0.0.1/32", "::1/128"]
          api_keys_file = "data/api_keys.json"
          [providers.maxmind]
          city = "data/databases/City.mmdb"
          '@ | Set-Content -Path $config -Encoding utf8
          $keyOutput = (& $exe --config $config --api-key --api-key-name "R4 Service CI") -join "`n"
          $keyMatch = [regex]::Match($keyOutput, "API Key: (rvg_[a-f0-9]{64})")
          if (-not $keyMatch.Success) { throw "Could not create service smoke API key" }
          $headers = @{ "X-API-Key" = $keyMatch.Groups[1].Value }
          $url = "http://127.0.0.1:19002/v1/geoip?ip=81.2.69.160"
          $installed = $false

          function Wait-GeoIp {
            param([int] $Attempts = 120)
            for ($i = 0; $i -lt $Attempts; $i++) {
              try {
                $response = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 2
                if ($response.country -eq "United Kingdom" -and $response.sources.location -eq "maxmind") { return }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            throw "Windows Service did not expose the authenticated HTTP API"
          }

          try {
            & $exe --config $config service install
            if ($LASTEXITCODE -ne 0) { throw "Service install failed" }
            $installed = $true
            $recovery = (sc.exe qfailure RemVibeGeoLocation) -join "`n"
            if ($recovery -notmatch "RESTART") { throw "SCM failure recovery is not configured" }
            $qc = (sc.exe qc RemVibeGeoLocation) -join "`n"
            if ($qc -notmatch "LocalService") { throw "Service is not using LocalService" }

            & $exe service start
            if ($LASTEXITCODE -ne 0) { throw "Service start failed" }
            Wait-GeoIp
            $keylessService = Invoke-RestMethod -Uri $url -TimeoutSec 2
            if ($keylessService.country -ne "United Kingdom") { throw "Trusted TCP peer cannot use Windows Service HTTP without API key" }
            $state = (& $exe service status) -join "`n"
            if ($state -notmatch "Running") { throw "SCM did not transition to RUNNING" }
            & $exe service stop
            if ($LASTEXITCODE -ne 0) { throw "Service stop failed" }

            # Hold its TCP port, start it again and then release the port:
            # process must recover without an external restart command.
            $blocker = [System.Net.Sockets.TcpListener]::new(
              [System.Net.IPAddress]::Loopback, 19002
            )
            $blocker.Start()
            try {
              & $exe service start
              if ($LASTEXITCODE -ne 0) { throw "SCM start under TCP collision failed" }
              Start-Sleep -Seconds 3
              $pending = (& $exe service status) -join "`n"
              if ($pending -notmatch "StartPending") {
                throw "SCM should remain START_PENDING during TCP recovery, got: $pending"
              }
            } finally {
              $blocker.Stop()
            }
            Wait-GeoIp
            $recovered = (& $exe service status) -join "`n"
            if ($recovered -notmatch "Running") { throw "Service did not recover its listening socket" }
            & $exe service stop
            if ($LASTEXITCODE -ne 0) { throw "Recovered service stop failed" }

            $log = Join-Path $data "logs/remvibe-geolocation.log"
            if (-not (Test-Path $log)) { throw "Service file logging not initialized" }
            if (-not (Select-String -Path $log -Pattern "TCP binding unavailable")) {
              throw "Missing diagnostic evidence for TCP startup recovery"
            }
            Write-Host "R4 native SCM smoke passed including TCP bind recovery and authenticated HTTP"
          } finally {
            if ($installed) {
              & $exe service uninstall
            }
          }
