name: Rust CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --locked --workspace
      - name: Fetch synthetic MMDB fixture for updater tests
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "GeoIP2-City-Test.mmdb"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data/GeoIP2-City-Test.mmdb" -OutFile $fixture
          "MAXMIND_TEST_MMDB_PATH=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $alternate = Join-Path $env:RUNNER_TEMP "GeoLite2-City-Test.mmdb"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data/GeoLite2-City-Test.mmdb" -OutFile $alternate
          "MAXMIND_TEST_MMDB_ALTERNATE_PATH=$alternate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test
        run: cargo test --locked --workspace
      - name: Smoke secured HTTP and MMDB lookups
        shell: pwsh
        run: |
          cargo build --locked --workspace
          $exe = if ($IsWindows) { "./target/debug/remvibe-geolocation.exe" } else { "./target/debug/remvibe-geolocation" }
          $work = Join-Path $env:RUNNER_TEMP "remvibe-geo-smoke"
          $db = Join-Path $work "databases"
          New-Item -ItemType Directory -Force -Path $db | Out-Null
          $root = "https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data"
          Invoke-WebRequest -Uri "$root/GeoIP2-City-Test.mmdb" -OutFile (Join-Path $db "City.mmdb")
          Invoke-WebRequest -Uri "$root/GeoIP2-Country-Test.mmdb" -OutFile (Join-Path $db "Country.mmdb")
          Invoke-WebRequest -Uri "$root/GeoLite2-ASN-Test.mmdb" -OutFile (Join-Path $db "ASN.mmdb")
          $config = Join-Path $work "config.toml"
          @'
          [server]
          host = "127.0.0.1"
          port = 19000
          [security]
          trusted_ips = ["127.0.0.1/32", "::1/128"]
          api_keys_file = "api_keys.json"
          [providers.maxmind]
          city = "databases/City.mmdb"
          country = "databases/Country.mmdb"
          asn = "databases/ASN.mmdb"
          '@ | Set-Content -Path $config

          $keyOutput = & $exe --config $config --api-key --api-key-name "MTN Launcher"
          $keyMatch = [regex]::Match(($keyOutput -join "`n"), "API Key: (rvg_[a-f0-9]{64})")
          if (-not $keyMatch.Success) { throw "API key could not be created" }
          $key = $keyMatch.Groups[1].Value
          $keyList = (& $exe --config $config --api-key-list) -join "`n"
          if ($keyList -notmatch "MTN Launcher" -or $keyList -match [regex]::Escape($key)) { throw "Key list content invalid" }

          $server = Start-Process -FilePath $exe -ArgumentList @("--config", $config) -PassThru -NoNewWindow
          try {
            $response = $null
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:19000/" -Headers @{ "X-API-Key" = $key } -SkipHttpErrorCheck
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $response -or $response.StatusCode -ne 200) { throw "Server did not answer with 200" }
            $missing = Invoke-WebRequest -Uri "http://127.0.0.1:19000/" -SkipHttpErrorCheck
            if ($missing.StatusCode -ne 401) { throw "Missing key was accepted" }

            $city = Invoke-RestMethod -Uri "http://127.0.0.1:19000/v1/geoip?ip=81.2.69.160" -Headers @{ "X-API-Key" = $key }
            if ($city.country -ne "United Kingdom" -or $city.sources.location -ne "maxmind") {
              throw "City MMDB lookup failed"
            }
            $asn = Invoke-RestMethod -Uri "http://127.0.0.1:19000/v1/geoip?ip=1.128.0.0" -Headers @{ "X-API-Key" = $key }
            if ($asn.asn.number -ne 1221 -or $asn.sources.asn -ne "maxmind") {
              throw "ASN MMDB lookup failed"
            }
            $bad = Invoke-WebRequest -Uri "http://127.0.0.1:19000/v1/geoip?ip=not_an_ip" -Headers @{ "X-API-Key" = $key } -SkipHttpErrorCheck
            if ($bad.StatusCode -ne 400) { throw "Invalid IP was accepted" }

            & $exe --config $config --delete-api-key $key
            $revoked = Invoke-WebRequest -Uri "http://127.0.0.1:19000/" -Headers @{ "X-API-Key" = $key } -SkipHttpErrorCheck
            if ($revoked.StatusCode -ne 401) { throw "Revoked API key was accepted" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Real DB-IP Lite country and ASN HTTPS / MMDB smoke
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { "./target/debug/remvibe-geolocation.exe" } else { "./target/debug/remvibe-geolocation" }
          $work = Join-Path $env:RUNNER_TEMP "dbip-lite-real-smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $config = Join-Path $work "config.toml"
          @'
          [server]
          host = "127.0.0.1"
          port = 19001
          [security]
          trusted_ips = ["127.0.0.1/32", "::1/128"]
          api_keys_file = "api_keys.json"
          [providers.dbip]
          country = "country.mmdb"
          asn = "asn.mmdb"
          [providers.dbip.updates]
          enabled = false
          check_on_start = false
          state_file = "dbip-updates.json"
          '@ | Set-Content -Path $config

          # The CLI downloads actual monthly DB-IP MMDB.gz files, verifies
          # metadata, extracts and atomically installs them. No fake fixture.
          $output = (& $exe --config $config --check-dbip-updates) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $output -notmatch "DB-IP country: updated" -or $output -notmatch "DB-IP asn: updated") {
            throw "DB-IP live download failed: $output"
          }

          $keyOutput = (& $exe --config $config --api-key --api-key-name "DB-IP CI") -join "`n"
          $match = [regex]::Match($keyOutput, "API Key: (rvg_[a-f0-9]{64})")
          if (-not $match.Success) { throw "Failed to create DB-IP smoke key" }
          $key = $match.Groups[1].Value
          $server = Start-Process -FilePath $exe -ArgumentList @("--config", $config) -PassThru -NoNewWindow
          try {
            $result = $null
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $result = Invoke-RestMethod -Uri "http://127.0.0.1:19001/v1/geoip?ip=8.8.8.8" -Headers @{ "X-API-Key" = $key }
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $result -or $result.country_code -ne "US" -or $result.sources.location -ne "dbip") {
              throw "Real DB-IP country lookup failed"
            }
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:19001/v1/geoip?ip=8.8.8.8" -Headers @{ "X-API-Key" = $key }
            if ($response.Headers["X-Data-Attribution"] -notmatch "db-ip.com") { throw "Missing DB-IP attribution" }
            $info = Invoke-RestMethod -Uri "http://127.0.0.1:19001/v1/attribution" -Headers @{ "X-API-Key" = $key }
            if ($info.dbip.url -ne "https://db-ip.com") { throw "Attribution endpoint failed" }
            $unauthorized = Invoke-WebRequest -Uri "http://127.0.0.1:19001/v1/attribution" -SkipHttpErrorCheck
            if ($unauthorized.StatusCode -ne 401) { throw "Attribution endpoint accepted an unauthorized caller" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
