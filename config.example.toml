# Copy to config.toml for local use. CLI --config selects a different file.
[server]
host = "127.0.0.1"
port = 19000

[security]
# Both trusted IP and API key are always required.
trusted_ips = ["127.0.0.1/32", "::1/128"]
api_keys_file = "data/api_keys.json"

# Uncomment database paths when local MMDB files are available.
# Loading an explicitly configured, missing/corrupt database fails startup.
[providers.maxmind]
# city = "data/databases/GeoLite2-City.mmdb"
# country = "data/databases/GeoLite2-Country.mmdb"
# asn = "data/databases/GeoLite2-ASN.mmdb"

# MaxMind downloader (R3A): choose which database(s) to manage using the
# uncommented city/country/asn paths above. Paths are relative to config.toml.
# Credentials can be configured here, but environment variables are preferred:
#   MAXMIND_ACCOUNT_ID, MAXMIND_LICENSE_KEY
# account_id = 123456
# license_key = "YOUR_SECRET"
# account_id_env = "MAXMIND_ACCOUNT_ID"
# license_key_env = "MAXMIND_LICENSE_KEY"
# city_edition = "GeoLite2-City"
# country_edition = "GeoLite2-Country"
# asn_edition = "GeoLite2-ASN"

[providers.maxmind.updates]
enabled = false               # set true to enable background updates
check_on_start = true
poll_minutes = 60             # scheduler wake frequency
release_check_hours = 4       # publish weekdays (per database)
other_check_hours = 24        # out-of-schedule checks
state_file = "data/updates/maxmind.json"

# R3C: DB-IP Lite is an independent optional provider and downloader.
# Free Lite databases use CC BY 4.0: https://db-ip.com
# When both providers are enabled, MaxMind is preferred and DB-IP fills
# missing location/ASN fields. DB-IP paths must not overlap MaxMind paths.
[providers.dbip]
# city = "data/databases/dbip-city-lite.mmdb"
# country = "data/databases/dbip-country-lite.mmdb"
# asn = "data/databases/dbip-asn-lite.mmdb"

[providers.dbip.updates]
enabled = false              # set true after enabling at least one path
check_on_start = true
poll_minutes = 60           # local file hot-reload and scheduler wake period
check_hours = 24            # provider monthly URL availability recheck
state_file = "data/updates/dbip.json"
